

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>QuickNotes</h1>
        <p>Your simple space to capture ideas.</p>
    </header>

    <main>
        <section>
            <h2>Add a note</h2>

            <form id="note-form">
                <label for="note-input">Write your note:</label>
                <input
                    type="text"
                    id="note-input"
                    placeholder="Type your note here..."
                >

                <label for="note-category">Choose a category:</label>
                <select id="note-category">
                    <option value="Personal">Personal</option>
                    <option value="Work">Work</option>
                    <option value="Study">Study</option>
                </select>

                <button type="submit">Add Note</button>
            </form>

            <p id="error-message"></p>
        </section>

        <section>
            <h2>Your notes</h2>

            <label for="search-input">Search your notes:</label>
            <input
                type="search"
                id="search-input"
                placeholder="Search notes..."
            >

            <p id="note-count">You have no notes yet.</p>

            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>Made with care using HTML, CSS and JavaScript.</p>
    </footer>

</body>
</html>
